<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AprendeIA Ética - Iniciar sesión</title>
  <style>
    /* Estilos generales y reseteo básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* 1. Header y Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background-color: #9cb5db;
      border-radius: 50%;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 15px;
    }

    nav a {
      text-decoration: none;
      color: #666;
      font-weight: 500;
    }

    /* 2. Sección Hero */
    .hero {
      background-color: #d0e1f9;
      border-radius: 8px;
      padding: 40px 30px;
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-content h1 {
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .hero-content p {
      color: #475569;
    }

    .hero-image-placeholder {
      width: 100px;
      height: 70px;
      background-color: #4a7bb0;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Simula la montaña/icono */
    }

    /* 3. Sección de 1 fila y 3 columnas */
    .cards-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background-color: #eef2f7;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 20px;
      height: 20px;
      background-color: #a0aec0;
      border-radius: 50%;
    }

    .card-title {
      font-weight: bold;
      color: #4a5568;
    }

    .card-line {
      height: 8px;
      background-color: #cbd5e0;
      border-radius: 4px;
      width: 80%;
    }

    /* 4. Footer */
    footer {
      background-color: #e2e8f0;
      text-align: center;
      padding: 15px;
      border-radius: 6px;
      font-weight: bold;
      color: #4a5568;
    }

    /* Responsivo para pantallas pequeñas */
    @media (max-width: 768px) {
      .cards-section {
        grid-template-columns: 1fr;
      }
      
      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
    }
  
.form-card{max-width:420px;margin:30px auto;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px}
.form-card h2{margin-bottom:14px;color:#1e293b}
.form-card label{display:block;font-size:.85rem;font-weight:bold;margin-top:10px}
.form-card input[type=text],.form-card input[type=email],.form-card input[type=password],.form-card textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin-top:4px;font-size:.9rem}
.btn{display:inline-block;background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;margin-top:16px;cursor:pointer;text-decoration:none}
.btn.o{background:#fff;color:#2563eb;border:2px solid #2563eb}
.small{font-size:.85rem;color:#64748b;margin-top:12px}
.bar{height:12px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#10b981}
.ok{background:#ecfdf5;border-left:5px solid #10b981;padding:14px;border-radius:6px}.no{background:#fef2f2;border-left:5px solid #ef4444;padding:14px;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tag{background:#dbeafe;color:#1e40af;font-size:.75rem;padding:3px 10px;border-radius:12px;display:inline-block;margin:2px}
p{line-height:1.5;margin:6px 0}

</style>
</head>
<body>
<div class="container">
<header><div class="logo"><div class="logo-icon"></div><span>AprendeIA Ética</span></div>
<nav><ul><li><a href="01_inicio.html">Inicio</a></li><li><a href="#">Cursos</a></li><li><a href="#">Normatividad</a></li></ul></nav></header>
<div class="form-card"><h2>Iniciar sesión</h2><label>Correo electrónico</label><input type="email" placeholder="usuario@correo.com"><label>Contraseña</label><input type="password" placeholder="••••••••"><a class="btn" href="#">Iniciar sesión</a><p class="small">¿No tienes cuenta? Regístrate</p></div>
<footer>© 2026 AprendeIA Ética</footer></div>
</body>
</html>
